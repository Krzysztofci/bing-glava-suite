[project]
name = "bing-glava-suite"
version = "1.0.0-rc2"
description = "Bing wallpaper + GLava audio visualizer GUI suite for Linux"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["glava", "audio-visualizer", "bing", "wallpaper", "linux", "xfce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Desktop Environment",
]
dependencies = [
    "Pillow>=9.0",
    "numpy>=1.21",
    "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/Krzysztofci/bing-glava-suite"
Documentation = "https://krzysztofci.github.io/bing-glava-suite/"
"Bug Tracker" = "https://github.com/Krzysztofci/bing-glava-suite/issues"
Changelog = "https://github.com/Krzysztofci/bing-glava-suite/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
    "UP007", # use X | Y instead of Optional[X] — leave for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # unused imports ok in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-v"

[tool.coverage.run]
source = ["scripts/gui"]
omit = [
    "scripts/gui/themes/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
