name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check scripts/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            x11-utils \
            xvfb \
            libgl1 \
            libglx-mesa0 \
            inotify-tools

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run tests (headless)
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          pytest --cov=scripts/gui --cov-report=xml --cov-report=term-missing \
            --deselect tests/test_glava_process.py::test_glava_start_no_instance_no_xdg \
            --deselect tests/test_tab_logic.py::test_load_colors_from_live_reads_frag \
            --deselect tests/test_tab_logic.py::test_load_colors_from_live_prefers_last_session

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
